# On OCP, Grafana is exposed via an OpenShift Route rather than a Kubernetes Ingress.
# Set the hostname to match your cluster's apps subdomain.
ingress:
  enabled: false

# OCP Route for Grafana — uncomment and set hostname after cluster is known
# route:
#   enabled: true
#   host: grafana.apps.<cluster-name>.<base-domain>

persistence:
  storageClassName: ocs-storagecluster-ceph-rbd

# Disable the init-chown-data container — it requires CHOWN capability which OCP restricts.
# The grafana SA is granted anyuid SCC, so the data directory permissions are fine.
initChownData:
  enabled: false

# OCP restricted-v2 SCC expects runAsNonRoot; grafana uses 472 — anyuid SCC grant handles it.
securityContext:
  runAsNonRoot: true
  runAsUser: 472
  fsGroup: 472
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
