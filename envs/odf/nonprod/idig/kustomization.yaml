apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# On OCP, subsystem CRs (AnalyticsCluster, DevPortalCluster, NanoGatewayCluster) are
# created and owned by the idig-operator — ArgoCD should leave them alone.
# The CRs are kept in the manifest so ArgoCD does not mark them requiresPruning=true,
# but all differences are suppressed via ignoreDifferences in the ApplicationSet template.
resources:
- ../../../../components/idig/base
