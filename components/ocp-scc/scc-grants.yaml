# -- monitoring namespace: prometheus node-exporter SA --
# Node-exporter uses hostPID:true + hostNetwork:true — needs node-exporter SCC
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-node-exporter-hostaccess-scc
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:node-exporter
subjects:
  - kind: ServiceAccount
    name: prometheus-prometheus-node-exporter
    namespace: monitoring
