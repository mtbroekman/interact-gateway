# OCP SCC grants for Helm charts that use non-OCP-default UIDs/fsGroups.
# These grants are required on OCP where the default SCC (restricted-v2)
# only allows UIDs in the namespace-allocated range.

# -- grafana namespace: grafana SA --
# Grafana uses runAsUser:472, fsGroup:472 and injects RuntimeDefault seccomp annotations.
# anyuid SCC disallows seccomp profiles, so use privileged SCC for the grafana SA.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-privileged-scc
  namespace: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: grafana

# -- monitoring namespace: loki SA --
# Loki + loki-chunks-cache + loki-results-cache + loki-gateway all use SA 'loki'
# runAsUser:101, fsGroup:101
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-anyuid-scc
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: loki
    namespace: monitoring

