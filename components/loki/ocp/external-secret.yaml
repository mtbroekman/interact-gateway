apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lokistack-storage-es
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: loki-obc-store
    kind: SecretStore
  target:
    name: lokistack-storage-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Keys required by the Loki Operator for type: s3
        bucketnames: "{{ .bucket_name }}"
        endpoint: "https://{{ .bucket_host }}:{{ .bucket_port }}"
        access_key_id: "{{ .access_key_id }}"
        access_key_secret: "{{ .access_key_secret }}"
        region: ""
  data:
    # Credentials from the OBC-generated Secret
    - secretKey: access_key_id
      remoteRef:
        key: lokistack-obc
        property: AWS_ACCESS_KEY_ID
    - secretKey: access_key_secret
      remoteRef:
        key: lokistack-obc
        property: AWS_SECRET_ACCESS_KEY
    # Bucket coordinates from the OBC-generated ConfigMap
    - secretKey: bucket_name
      remoteRef:
        key: lokistack-obc
        property: BUCKET_NAME
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
    - secretKey: bucket_host
      remoteRef:
        key: lokistack-obc
        property: BUCKET_HOST
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
    - secretKey: bucket_port
      remoteRef:
        key: lokistack-obc
        property: BUCKET_PORT
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: Fetch
