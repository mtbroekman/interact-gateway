# This Job reads the ObjectBucketClaim outputs (a Secret with AWS-style keys and a
# ConfigMap with bucket/endpoint details) and assembles the single Secret that the
# Loki Operator requires for S3 storage.
#
# The OBC is created in the same namespace by obc.yaml and is managed by NooBaa.
# The OBC controller creates:
#   Secret  <obc-name>  with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#   ConfigMap <obc-name> with BUCKET_NAME / BUCKET_HOST / BUCKET_PORT
#
# The Loki Operator requires a Secret with keys:
#   bucketnames  — bucket name
#   endpoint     — full https URL  (e.g. https://s3.openshift-storage.svc:443)
#   access_key_id
#   access_key_secret
#
# The Job is idempotent: it uses `kubectl apply` with a generated manifest so that
# ArgoCD can re-sync it without errors.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lokistack-secret-bootstrap
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lokistack-secret-bootstrap
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lokistack-secret-bootstrap
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lokistack-secret-bootstrap
subjects:
  - kind: ServiceAccount
    name: lokistack-secret-bootstrap
    namespace: monitoring
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lokistack-secret-bootstrap
  namespace: monitoring
  annotations:
    # Re-run on every ArgoCD sync so the secret stays up to date if the OBC rotates.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: lokistack-secret-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: registry.redhat.io/openshift4/ose-tools-rhel9:latest
          command:
            - /bin/bash
            - -ec
            - |
              NS=monitoring
              OBC_NAME=lokistack-obc

              echo "Reading OBC Secret and ConfigMap..."
              ACCESS_KEY_ID=$(kubectl get secret "${OBC_NAME}" -n "${NS}" \
                -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
              ACCESS_KEY_SECRET=$(kubectl get secret "${OBC_NAME}" -n "${NS}" \
                -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)
              BUCKET_NAME=$(kubectl get cm "${OBC_NAME}" -n "${NS}" \
                -o jsonpath='{.data.BUCKET_NAME}')
              BUCKET_HOST=$(kubectl get cm "${OBC_NAME}" -n "${NS}" \
                -o jsonpath='{.data.BUCKET_HOST}')
              BUCKET_PORT=$(kubectl get cm "${OBC_NAME}" -n "${NS}" \
                -o jsonpath='{.data.BUCKET_PORT}')

              ENDPOINT="https://${BUCKET_HOST}:${BUCKET_PORT}"

              echo "Assembling lokistack-storage-secret (endpoint=${ENDPOINT}, bucket=${BUCKET_NAME})..."

              kubectl create secret generic lokistack-storage-secret \
                -n "${NS}" \
                --from-literal=bucketnames="${BUCKET_NAME}" \
                --from-literal=endpoint="${ENDPOINT}" \
                --from-literal=access_key_id="${ACCESS_KEY_ID}" \
                --from-literal=access_key_secret="${ACCESS_KEY_SECRET}" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "Done."
