apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-obc-reader
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loki-obc-reader
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    resourceNames: ["lokistack-obc"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-obc-reader
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: loki-obc-reader
    namespace: monitoring
roleRef:
  kind: Role
  name: loki-obc-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: loki-obc-reader-token
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: loki-obc-reader
type: kubernetes.io/service-account-token
