apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: lokistack
  namespace: monitoring
spec:
  size: 1x.extra-small
  storage:
    schemas:
      - version: v13
        effectiveDate: "2024-01-01"
    secret:
      # Assembled by ExternalSecret lokistack-storage-es from the OBC Secret + ConfigMap.
      name: lokistack-storage-secret
      type: s3
    tls:
      # NooBaa uses a self-signed certificate — skip verification.
      caName: ""
  storageClassName: ocs-storagecluster-ceph-rbd
  tenants:
    mode: openshift-logging
