apiVersion: nanogateway.apiconnect.ibm.com/v1beta1
kind: NanoGatewayCluster
metadata:
  name: idig-nanogw
  namespace: idig
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  # mgmtEndpoint.gatewayClassName is required on clusters with Envoy Gateway (IKS/AKS).
  # On OpenShift the operator uses native Routes — omit gatewayClassName there.
  mgmtEndpoint:
    gatewayClassName: envoy
    ingressClassName: ""
