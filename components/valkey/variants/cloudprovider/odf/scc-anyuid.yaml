# Grant anyuid SCC to the default SA in the idig namespace.
#
# Required on OCP because the Valkey operator sets podSecurityContext.fsGroup: 1000
# in the StatefulSet it creates. OCP's default restricted-v2 SCC only allows fsGroup
# values in the namespace-allocated range — 1000 falls outside it and is rejected.
#
# The Valkey StatefulSet uses the 'default' ServiceAccount (no explicit SA is set).
# anyuid allows any fsGroup/UID, enabling the pod to start.
#
# See README.md in this directory for full explanation.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: valkey-anyuid-scc
  namespace: idig
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: default
    namespace: idig
