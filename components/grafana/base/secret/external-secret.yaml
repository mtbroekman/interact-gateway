apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-es
spec:
  refreshInterval: "0"
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        admin-user: "admin"
        admin-password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: grafana-admin-password
