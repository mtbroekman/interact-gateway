# ClusterRole that grants read access to the LokiStack "application" tenant.
# In openshift-logging mode the LokiStack gateway performs a SubjectAccessReview
# checking: verb=get, group=loki.grafana.com, resource=logs, subresource=application
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lokistack-application-logs-reader
rules:
  - apiGroups: [loki.grafana.com]
    resources: [logs]
    resourceNames: [application]
    verbs: [get]
  - apiGroups: [loki.grafana.com]
    resources: [application]
    resourceNames: [logs]
    verbs: [get]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [project.openshift.io]
    resources: [projects]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-lokistack-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lokistack-application-logs-reader
subjects:
  - kind: ServiceAccount
    name: grafana-sa
    namespace: grafana
  - kind: ServiceAccount
    name: grafana
    namespace: grafana
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-sa-token
  namespace: grafana
  annotations:
    kubernetes.io/service-account.name: grafana-sa
type: kubernetes.io/service-account-token
