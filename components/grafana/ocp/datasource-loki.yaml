apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # valuesFrom injects the full "Bearer <token>" value into secureJsonData.httpHeaderValue2.
  # The grafana-loki-bearer-token secret is created by the bearer-token-bootstrap Job
  # (see bearer-token-bootstrap-job.yaml) which prepends "Bearer " to the SA token.
  # This is the correct Grafana Operator v5 mechanism — secureJsonData ${ENV_VAR}
  # interpolation is not performed by this operator.
  # valuesFrom substitutes ${LOKI_BEARER_TOKEN} placeholders in the datasource spec
  # with the value from the grafana-loki-bearer-token secret. The key name ("LOKI_BEARER_TOKEN")
  # must match the ${} placeholder used in secureJsonData below.
  valuesFrom:
    - targetPath: "secureJsonData.httpHeaderValue2"
      valueFrom:
        secretKeyRef:
          name: grafana-loki-bearer-token
          key: LOKI_BEARER_TOKEN
  datasource:
    name: Loki
    type: loki
    uid: loki
    # LokiStack gateway — openshift-logging tenant mode
    url: https://lokistack-gateway-http.monitoring.svc.cluster.local:8080/api/logs/v1/application
    access: proxy
    jsonData:
      httpHeaderName1: "X-Scope-OrgID"
      httpHeaderName2: "Authorization"
      tlsSkipVerify: true
    secureJsonData:
      httpHeaderValue1: "application"
      # ${LOKI_BEARER_TOKEN} is substituted from grafana-loki-bearer-token secret key LOKI_BEARER_TOKEN
      httpHeaderValue2: "${LOKI_BEARER_TOKEN}"
