# ServiceAccount token secret — long-lived, kubernetes.io/service-account-token type.
# Used by Alloy to authenticate against the LokiStack gateway in openshift-logging mode.
# The projected SA token (audience: kubernetes.default.svc) is redirected to OpenShift
# OAuth by the gateway; the legacy secret token is accepted via TokenReview.
apiVersion: v1
kind: Secret
metadata:
  name: alloy-ocp-sa-token
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: alloy-ocp
type: kubernetes.io/service-account-token
