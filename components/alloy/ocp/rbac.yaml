# ClusterRole that grants write access to the LokiStack "application" tenant.
# opa-openshift checks both resourceNames directions, mirroring the auto-created
# lokistack-application-logs-reader ClusterRole pattern (just with create instead of get).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lokistack-application-logs-writer
rules:
  - apiGroups: [loki.grafana.com]
    resources: [logs]
    resourceNames: [application]
    verbs: [create, get]
  - apiGroups: [loki.grafana.com]
    resources: [application]
    resourceNames: [logs]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [project.openshift.io]
    resources: [projects]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-ocp-lokistack-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lokistack-application-logs-writer
subjects:
  - kind: ServiceAccount
    name: alloy-ocp
    namespace: monitoring
