apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nanogw-operator
  namespace: argocd
  labels:
    group: applications
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  destination:
    namespace: idig
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./components/nanogw/operator
  ignoreDifferences:
    # Ignore annotations stamped by the nanogw operator and by kubectl apply
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations/nano.datapower.ibm.com~1operator-version
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true