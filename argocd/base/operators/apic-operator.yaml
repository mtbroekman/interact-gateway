apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apic-operator
  namespace: argocd
  labels:
    group: applications
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  destination:
    namespace: idig
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./components/apic/operator
  ignoreDifferences:
    # OCP Pipelines operator and OCP itself stamp labels onto every namespace
    - kind: Namespace
      jsonPointers:
        - /metadata/labels/openshift-pipelines.tekton.dev~1namespace-reconcile-version
        - /metadata/labels/openshift-pipelines.tekton.dev~1namespace-trusted-configmaps-version
        - /metadata/labels/pod-security.kubernetes.io~1audit
        - /metadata/labels/pod-security.kubernetes.io~1audit-version
        - /metadata/labels/pod-security.kubernetes.io~1warn
        - /metadata/labels/pod-security.kubernetes.io~1warn-version
    # EDB PostgreSQL CRDs exceed the 262144-byte annotation limit for both SSA and
    # kubectl apply. Ignore their spec entirely — they are installed once and do not
    # change between IDIG releases. Re-sync manually if a release upgrades them.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: clusters.postgresql.k8s.enterprisedb.io
      jqPathExpressions:
        - .spec
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: poolers.postgresql.k8s.enterprisedb.io
      jqPathExpressions:
        - .spec
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      prune: false
      selfHeal: true