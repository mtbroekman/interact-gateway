apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "190"
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: "1.18.2"
    helm:
      valuesObject:
        tempo:
          # Bind OTLP receivers to 0.0.0.0 so in-cluster traffic reaches them.
          # Alloy pushes traces to tempo.monitoring.svc.cluster.local:4317.
          # Grafana queries the HTTP API on port 3200.
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: "0.0.0.0:4317"
                http:
                  endpoint: "0.0.0.0:4318"
        persistence:
          enabled: true
          storageClassName: ibmc-vpc-block-10iops-tier
          size: 10Gi
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
