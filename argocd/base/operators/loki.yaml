apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "190"
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: "6.30.1"
    helm:
      valuesObject:
        # Single-binary (monolithic) mode — simplest for nonprod.
        # Alloy pushes logs to loki.monitoring.svc.cluster.local:3100/loki/api/v1/push.
        # Grafana queries the same port.
        deploymentMode: SingleBinary
        test:
          enabled: false
        lokiCanary:
          enabled: false
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          limits_config:
            volume_enabled: true
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
        singleBinary:
          replicas: 1
          persistence:
            storageClass: ibmc-vpc-block-10iops-tier
            size: 10Gi
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
