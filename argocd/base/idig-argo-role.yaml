kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: idig-argo-role
rules:
  # Cert-manager
  - verbs: ['*']
    apiGroups: [cert-manager.io]
    resources: ['*']

  # External Secrets
  - verbs: ['*']
    apiGroups: [external-secrets.io]
    resources: ['*']

  - verbs: ['*']
    apiGroups: [generators.external-secrets.io]
    resources: ['*']

  - verbs: ['*']
    apiGroups: [operator.external-secrets.io]
    resources: ['*']

  # Gateway API
  - verbs: ['*']
    apiGroups: [gateway.networking.k8s.io]
    resources: ['*']

  # Envoy Gateway
  - verbs: ['*']
    apiGroups: [gateway.envoyproxy.io]
    resources: ['*']

  # IBM / APIC operands
  - verbs: ['*']
    apiGroups:
      - operator.ibm.com
      - apiconnect.ibm.com
      - datapower.ibm.com
      - management.apiconnect.ibm.com
      - nanogateway.apiconnect.ibm.com
      - nano.datapower.ibm.com
      - gateway.apiconnect.ibm.com
      - valkey.datapower.ibm.com
      - datapowerinteractgateway.ibm.com
      - analytics.apiconnect.ibm.com
      - devportal.apiconnect.ibm.com
    resources: ['*']

  # Valkey
  - verbs: ['*']
    apiGroups: [valkey.datapower.ibm.com]
    resources: ['*']

  # RBAC (Roles/RoleBindings for loki-obc-reader SA) and ServiceAccounts
  - verbs: ['*']
    apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]

  - verbs: ['*']
    apiGroups: ['']
    resources: [serviceaccounts, secrets, configmaps]

  # OLM — Subscriptions, OperatorGroups, InstallPlans (used by all OCP operators)
  - verbs: ['*']
    apiGroups:
      - operators.coreos.com
      - packages.operators.coreos.com
    resources: ['*']

  # Loki Operator CRs
  - verbs: ['*']
    apiGroups: [loki.grafana.com]
    resources: ['*']

  # Grafana Operator CRs
  - verbs: ['*']
    apiGroups: [grafana.integreatly.org]
    resources: ['*']

  # Grafana Alloy Operator CRs
  - verbs: ['*']
    apiGroups: [collectors.grafana.com]
    resources: ['*']

  # ODF ObjectBucketClaim
  - verbs: ['*']
    apiGroups: [objectbucket.io]
    resources: ['*']

  # Policy (PodDisruptionBudgets used by Loki/Grafana)
  - verbs: ['*']
    apiGroups: [policy]
    resources: ['*']

  # Monitoring
  - verbs: ['*']
    apiGroups: [monitoring.coreos.com]
    resources: ['*']
