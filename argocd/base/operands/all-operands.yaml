apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apic-operands
spec:
  generators:
  - list:
      elements:
        - name: envoy
          namespace: envoy-gateway-system
          sync-wave: "300"
        - name: valkey
          namespace: idig
          sync-wave: "300"
        - name: idig
          namespace: idig
          sync-wave: "300"
  template:
    metadata:
      name: '{{name}}'
      labels:
        group: applications
      annotations:
        argocd.argoproj.io/sync-wave: '{{sync-wave}}'
    spec:
      project: default
      source:
        path: 'envs/iks/nonprod/{{name}}/'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      ignoreDifferences:
      # Subsystem CRs: ignore status (never managed by ArgoCD) and specific annotations
      # stamped by the operator after creation. Do NOT ignore .spec — ArgoCD must be
      # able to enforce desired state (e.g. image overrides via template field).
      - group: analytics.apiconnect.ibm.com
        kind: AnalyticsCluster
        jqPathExpressions:
        - .status
        - .metadata.annotations["com.ibm.apiconnect/analytics-upgraded-version"]
      - group: devportal.apiconnect.ibm.com
        kind: DevPortalCluster
        jqPathExpressions:
        - .status
      - group: nanogateway.apiconnect.ibm.com
        kind: NanoGatewayCluster
        jqPathExpressions:
        - .status
      syncPolicy:
        syncOptions:
          - ServerSideApply=true
        automated:
          selfHeal: true
