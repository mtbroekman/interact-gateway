apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apic-operands
spec:
  generators:
  - list:
      elements:
        - name: envoy
          namespace: envoy-gateway-system
          sync-wave: "300"
        - name: valkey
          namespace: idig
          sync-wave: "300"
        - name: idig
          namespace: idig
          sync-wave: "300"
  template:
    metadata:
      name: '{{name}}'
      labels:
        group: applications
      annotations:
        argocd.argoproj.io/sync-wave: '{{sync-wave}}'
    spec:
      project: default
      source:
        path: 'envs/iks/nonprod/{{name}}/'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      ignoreDifferences:
      # Subsystem CRs are owned by idig-operator — ignore all spec/status/annotation drift
      - group: analytics.apiconnect.ibm.com
        kind: AnalyticsCluster
        jqPathExpressions:
        - .spec
        - .status
        - .metadata.annotations
      - group: devportal.apiconnect.ibm.com
        kind: DevPortalCluster
        jqPathExpressions:
        - .spec
        - .status
        - .metadata.annotations
      - group: nanogateway.apiconnect.ibm.com
        kind: NanoGatewayCluster
        jqPathExpressions:
        - .spec
        - .status
        - .metadata.annotations
      syncPolicy:
        syncOptions:
          - ServerSideApply=true
        automated:
          selfHeal: true
