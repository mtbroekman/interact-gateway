kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: idig-argo-rb
# SA name depends on ArgoCD install method:
#   OpenShift GitOps (OLM): openshift-gitops-argocd-application-controller / namespace: openshift-gitops
#   Helm install:           argocd-application-controller / namespace: openshift-gitops
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: idig-argo-role