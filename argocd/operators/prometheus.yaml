apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "190"
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: "27.3.0"
    helm:
      valuesObject:
        # Minimal single-replica install — no alertmanager, no pushgateway.
        # Alloy writes metrics via remote_write; Grafana reads via the
        # prometheus-server ClusterIP at prometheus-server.monitoring:80.
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        server:
          remoteWrite: []   # Alloy pushes to /api/v1/write — no extra config needed here
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
