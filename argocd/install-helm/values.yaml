server:
  # ArgoCD must run in insecure mode when TLS is terminated at the Ingress
  extraArgs:
    - --insecure

  ingress:
    enabled: true
    ingressClassName: public-iks-k8s-nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-passthrough: "false"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # IKS public ingress subdomain — replace with your cluster's subdomain
    hostname: argocd.REPLACE_ME_CLUSTER_SUBDOMAIN
    tls: true
    extraTls:
      - hosts:
          - argocd.REPLACE_ME_CLUSTER_SUBDOMAIN
        secretName: REPLACE_ME_CLUSTER_SECRET

configs:
  params:
    # Required when TLS is terminated at the Ingress
    server.insecure: "true"

  cm:
    # Required for SSO redirect URIs and the UI login link
    url: https://argocd.REPLACE_ME_CLUSTER_SUBDOMAIN
repoServer:
  replicas: 1

applicationSet:
  replicas: 1

notifications:
  enabled: true

redis:
  enabled: true

dex:
  # Disable Dex if you are not using SSO
  enabled: false

global:
  # Resource limits — tune per environment
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
