apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-ocp
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "200"
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: "0.12.5"
      helm:
        # OCP values override base values — Loki endpoint points at LokiStack gateway
        valueFiles:
          - $values/components/alloy/ocp/values.yaml
    - ref: values
      repoURL: https://github.com/mtbroekman/interact-gateway.git
      targetRevision: HEAD
    - path: ./envs/odf/nonprod/alloy
      repoURL: https://github.com/mtbroekman/interact-gateway.git
      targetRevision: HEAD
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
