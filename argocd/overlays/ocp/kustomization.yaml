apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # OCP uses native Routes — remove the envoy-operator Application
  - target:
      group: argoproj.io
      kind: Application
      name: envoy-operator
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: envoy-operator

  # external-secrets-operator is pre-installed on this OCP cluster — skip it
  - target:
      group: argoproj.io
      kind: Application
      name: external-secrets-operator
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: external-secrets-operator

  # Prometheus is bundled with OCP — skip the community Helm chart
  - target:
      group: argoproj.io
      kind: Application
      name: prometheus
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: prometheus

  # Grafana: switch values paths from envs/iks to envs/odf
  - target:
      group: argoproj.io
      kind: Application
      name: grafana
    patch: |-
      - op: replace
        path: /spec/sources/0/helm/valueFiles
        value:
          - $values/components/grafana/base/values.yaml
          - $values/envs/odf/nonprod/grafana/values.yaml
      - op: replace
        path: /spec/sources/2/path
        value: ./envs/odf/nonprod/grafana

  # Alloy: switch values path from envs/iks to envs/odf
  - target:
      group: argoproj.io
      kind: Application
      name: alloy
    patch: |-
      - op: replace
        path: /spec/sources/2/path
        value: ./envs/odf/nonprod/alloy

  # Loki: use OCP/ODF storage class
  - target:
      group: argoproj.io
      kind: Application
      name: loki
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/singleBinary/persistence/storageClass
        value: ocs-storagecluster-ceph-rbd

  # Tempo: use OCP/ODF storage class
  - target:
      group: argoproj.io
      kind: Application
      name: tempo
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/persistence/storageClassName
        value: ocs-storagecluster-ceph-rbd

  # ApplicationSet: point to envs/odf/nonprod, remove envoy operand
  - target:
      group: argoproj.io
      kind: ApplicationSet
    patch: |-
      - op: replace
        path: /spec/generators/0/list/elements
        value:
          - name: valkey
            namespace: idig
            sync-wave: "300"
          - name: idig
            namespace: idig
            sync-wave: "300"
      - op: replace
        path: /spec/template/spec/source/path
        value: 'envs/odf/nonprod/{{name}}/'
