apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # OCP uses openshift-gitops namespace (OpenShift GitOps OLM operator).
  # Base uses "argocd" (standard Helm install). Patch all Applications + ApplicationSet.
  - target:
      group: argoproj.io
      kind: Application
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: openshift-gitops

  - target:
      group: argoproj.io
      kind: ApplicationSet
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: openshift-gitops

  # OCP uses openshift-gitops SA name (not argocd-application-controller)
  - target:
      kind: ClusterRoleBinding
      name: idig-argo-rb
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: openshift-gitops-argocd-application-controller
      - op: replace
        path: /subjects/0/namespace
        value: openshift-gitops

  # OCP uses native Routes — remove the envoy-operator Application
  - target:
      group: argoproj.io
      kind: Application
      name: envoy-operator
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: envoy-operator

  # external-secrets-operator is pre-installed on this OCP cluster — skip it
  - target:
      group: argoproj.io
      kind: Application
      name: external-secrets-operator
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: external-secrets-operator

  # Monitoring stack (prometheus, grafana, loki, tempo, alloy) — remove from OCP.
  # On OCP these should be handled via OCP-native operators (OpenShift Monitoring,
  # Grafana Operator, Loki Operator), not community Helm charts with SCC issues.
  - target:
      group: argoproj.io
      kind: Application
      name: prometheus
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: prometheus

  - target:
      group: argoproj.io
      kind: Application
      name: grafana
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: grafana

  - target:
      group: argoproj.io
      kind: Application
      name: loki
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: loki

  - target:
      group: argoproj.io
      kind: Application
      name: tempo
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: tempo

  - target:
      group: argoproj.io
      kind: Application
      name: alloy
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: alloy

  # ApplicationSet: point to envs/odf/nonprod, remove envoy operand
  - target:
      group: argoproj.io
      kind: ApplicationSet
    patch: |-
      - op: replace
        path: /spec/generators/0/list/elements
        value:
          - name: valkey
            namespace: idig
            sync-wave: "300"
          - name: idig
            namespace: idig
            sync-wave: "300"
      - op: replace
        path: /spec/template/spec/source/path
        value: 'envs/odf/nonprod/{{name}}/'
