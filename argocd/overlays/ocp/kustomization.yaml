apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # OCP-native operator subscriptions (OLM)
  - operators/grafana-operator.yaml
  - operators/loki-operator.yaml
  - operators/alloy-operator.yaml
  # OCP-native operand Applications
  - operands/grafana.yaml
  - operands/loki.yaml
  - operands/alloy.yaml

patches:
  # OCP uses openshift-gitops namespace (OpenShift GitOps OLM operator).
  # Base uses "argocd" (standard Helm install). Patch all Applications + ApplicationSet.
  - target:
      group: argoproj.io
      kind: Application
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: openshift-gitops

  - target:
      group: argoproj.io
      kind: ApplicationSet
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: openshift-gitops

  # OCP uses openshift-gitops SA name (not argocd-application-controller)
  - target:
      kind: ClusterRoleBinding
      name: idig-argo-rb
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: openshift-gitops-argocd-application-controller
      - op: replace
        path: /subjects/0/namespace
        value: openshift-gitops

  # OCP uses native Routes — remove the envoy-operator Application
  - target:
      group: argoproj.io
      kind: Application
      name: envoy-operator
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: envoy-operator

  # external-secrets-operator is pre-installed on this OCP cluster — skip it
  - target:
      group: argoproj.io
      kind: Application
      name: external-secrets-operator
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: external-secrets-operator

  # Prometheus and Tempo are still removed — use OpenShift Monitoring for metrics
  # and add a Tempo Operator subscription separately when needed.
  - target:
      group: argoproj.io
      kind: Application
      name: prometheus
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: prometheus

  - target:
      group: argoproj.io
      kind: Application
      name: tempo
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: tempo

  # Remove the Helm-based grafana, loki, and alloy Applications from the base —
  # they are replaced above by OCP-native operator versions.
  - target:
      group: argoproj.io
      kind: Application
      name: grafana
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: grafana

  - target:
      group: argoproj.io
      kind: Application
      name: loki
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: loki

  - target:
      group: argoproj.io
      kind: Application
      name: alloy
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: alloy

  # Inject repoURL into all OCP-only Applications (not covered by base patches)
  - target:
      group: argoproj.io
      kind: Application
      name: grafana-operator
    patch: |-
      - op: add
        path: /spec/source/repoURL
        value: https://github.com/mtbroekman/interact-gateway.git
      - op: add
        path: /spec/source/targetRevision
        value: HEAD

  - target:
      group: argoproj.io
      kind: Application
      name: loki-operator
    patch: |-
      - op: add
        path: /spec/source/repoURL
        value: https://github.com/mtbroekman/interact-gateway.git
      - op: add
        path: /spec/source/targetRevision
        value: HEAD

  - target:
      group: argoproj.io
      kind: Application
      name: alloy-operator
    patch: |-
      - op: add
        path: /spec/source/repoURL
        value: https://github.com/mtbroekman/interact-gateway.git
      - op: add
        path: /spec/source/targetRevision
        value: HEAD

  - target:
      group: argoproj.io
      kind: Application
      name: grafana-ocp
    patch: |-
      - op: add
        path: /spec/source/repoURL
        value: https://github.com/mtbroekman/interact-gateway.git
      - op: add
        path: /spec/source/targetRevision
        value: HEAD

  - target:
      group: argoproj.io
      kind: Application
      name: loki-ocp
    patch: |-
      - op: add
        path: /spec/source/repoURL
        value: https://github.com/mtbroekman/interact-gateway.git
      - op: add
        path: /spec/source/targetRevision
        value: HEAD

  - target:
      group: argoproj.io
      kind: Application
      name: alloy-ocp
    patch: |-
      - op: add
        path: /spec/source/repoURL
        value: https://github.com/mtbroekman/interact-gateway.git
      - op: add
        path: /spec/source/targetRevision
        value: HEAD

  # ApplicationSet: point to envs/odf/nonprod, remove envoy operand
  - target:
      group: argoproj.io
      kind: ApplicationSet
    patch: |-
      - op: replace
        path: /spec/generators/0/list/elements
        value:
          - name: valkey
            namespace: idig
            sync-wave: "300"
          - name: idig
            namespace: idig
            sync-wave: "300"
      - op: replace
        path: /spec/template/spec/source/path
        value: 'envs/odf/nonprod/{{name}}/'
