# Apply once manually to bootstrap ArgoCD:
#   oc apply -f argocd/bootstrap.yaml            (OpenShift — uses openshift-gitops namespace)
#   kubectl apply -f argocd/bootstrap-iks.yaml   (IKS/AKS  — uses argocd namespace, points at overlays/iks)
#
# Set namespace and source path to match your environment:
#   OpenShift GitOps (OLM): namespace: openshift-gitops, path: ./argocd/overlays/ocp
#   Helm install (IKS/AKS): namespace: argocd,           path: ./argocd/overlays/iks  (or aks)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: openshift-gitops
spec:
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./argocd/overlays/ocp
    repoURL: https://github.com/mtbroekman/interact-gateway.git
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
